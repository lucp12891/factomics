url: https://lucp12891.github.io/factomics/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    primary: "#1A2A4F"
    base_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

home:
  title: factomics
  description: One toolbox for multi-omics factor analysis in R.
  sidebar:
    structure: [links, license, citation, authors, dev]

navbar:
  structure:
    left: [intro, methods, visualization, clustering, articles, reference, news]
    right: [search, github]
  components:
    methods:
      text: Methods
      href: articles/methods.html
    visualization:
      text: Visualisation
      href: articles/visualization.html
    clustering:
      text: Clustering
      href: articles/clustering.html
    articles:
      text: Articles
      menu:
      - text: "Guides"
      - text: Methods and how to tune them
        href: articles/methods.html
      - text: Embeddings and visualisation (PCA, UMAP, t-SNE)
        href: articles/visualization.html
      - text: Clustering samples on factors
        href: articles/clustering.html
      - text: Benchmarking factor methods
        href: articles/benchmarking.html
      - text: -------
      - text: "Practical"
      - text: Using your own data
        href: articles/own-data.html
      - text: Docker and the command line
        href: articles/docker.html
    github:
      icon: fa-github
      href: https://github.com/lucp12891/factomics
      aria-label: GitHub

