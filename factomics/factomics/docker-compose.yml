version: "3.9"

services:

  # ----------------------------------------------------------------
  # Interactive R session with OmicsFactoR pre-installed
  # ----------------------------------------------------------------
  r-session:
    build:
      context: .
      dockerfile: Dockerfile
    image: omicsfactor:latest
    container_name: omicsfactor_r
    # Mount a local data folder so you can read/write files easily
    volumes:
      - ./data:/work/data
      - ./output:/work/output
    working_dir: /work
    stdin_open: true
    tty: true
    command: R

  # ----------------------------------------------------------------
  # RStudio Server (optional; browse to http://localhost:8787)
  # user: rstudio  password: omicspassword
  # ----------------------------------------------------------------
  rstudio:
    image: omicsfactor:latest
    container_name: omicsfactor_rstudio
    ports:
      - "8787:8787"
    environment:
      - PASSWORD=omicspassword
      - ROOT=TRUE
    volumes:
      - ./data:/home/rstudio/data
      - ./output:/home/rstudio/output
    command: >
      bash -c "apt-get install -y gdebi-core &&
               wget https://download2.rstudio.org/server/focal/amd64/rstudio-server-2023.12.0-369-amd64.deb &&
               gdebi -n rstudio-server-2023.12.0-369-amd64.deb &&
               /usr/lib/rstudio-server/bin/rserver --server-daemonize=0"
    profiles:
      - rstudio   # only start with: docker compose --profile rstudio up
